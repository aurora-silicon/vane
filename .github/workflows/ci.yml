name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          source-tag: v0.1.6
          use-gha-cache: true
          use-flakehub: false
          diagnostic-endpoint: ""

      - name: Run Lean, proof, TCB and Go checks
        run: nix flake check --no-update-lock-file --print-build-logs

      - name: Build static arm64 runner
        if: matrix.os == 'ubuntu-24.04'
        run: nix build --no-update-lock-file --no-link --print-build-logs .#vane-runner-arm64

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check Signed-off-by on every commit
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          commits=$(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA")
          if [ -z "$commits" ]; then
            echo "::error::no non-merge commits found in $BASE_SHA..$HEAD_SHA"
            exit 1
          fi
          missing=0
          count=0
          for sha in $commits; do
            count=$((count + 1))
            if ! git show -s --format=%B "$sha" \
                | grep -Eq '^Signed-off-by: [^<>]+ <[^<>@ ]+@[^<>@ ]+>[[:space:]]*$'; then
              echo "::error::commit $(git show -s --format='%h %s' "$sha") has no 'Signed-off-by: Name <email>' trailer"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo
            echo "$missing of $count commit(s) lack a Signed-off-by trailer."
            echo "Sign the last commit with:   git commit --amend -s --no-edit"
            echo "Sign every commit in the PR: git rebase --signoff $BASE_SHA"
            echo "New commits:                 git commit -s"
            echo "Then force-push the branch."
            exit 1
          fi
          echo "All $count commit(s) carry a Signed-off-by trailer."
